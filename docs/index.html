<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="练习记录">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>练习记录 · 琴时</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#f2f5f1;background:#101a19}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1020px;margin:auto;padding:34px 22px 70px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.brand{font-size:13px;font-weight:700;letter-spacing:.2em;color:#9ab3a4}
h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.045em;margin:0;font-weight:650}
h2{font-size:19px;margin:0;font-weight:620}
.muted{color:#9eb0a6}
.card{background:#192925;border:1px solid #365047;border-radius:24px;padding:clamp(22px,4vw,34px);margin-bottom:18px}
.overview{background:radial-gradient(circle at 85% 10%,#315649,transparent 45%),linear-gradient(135deg,#203830,#182b27)}
.tabs{display:flex;gap:6px;padding:5px;background:#14231f;border:1px solid #385247;border-radius:13px;margin-bottom:26px;max-width:460px}
.tabs button{flex:1;border:0;border-radius:9px;background:transparent;color:#a8beb1;font:inherit;font-size:14px;font-weight:600;padding:10px 6px;cursor:pointer}
.tabs button.active{background:#d7e9d8;color:#1d3928}
.custom{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin:-8px 0 22px;color:#b4c5b9}
.custom.show{display:flex}
input[type=date]{background:#21382f;border:1px solid #5c7866;color:#f2f5f1;border-radius:9px;padding:9px;font:inherit}
.label{color:#b2c7b9;font-size:14px;margin-bottom:8px}
.total{display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums}
.total strong{font-size:clamp(55px,10vw,90px);font-weight:650;letter-spacing:-.065em;line-height:1.1}
.total span{font-size:20px;color:#d0e0d2}
.overview-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;color:#a8c0ad;font-size:14px}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.chart-head span{font-size:13px;color:#9eb0a6}
.chart-layout{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px}
.y-axis{height:226px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;color:#8fa99a;font-size:11px;font-variant-numeric:tabular-nums}
.plot{position:relative;height:226px;border-bottom:1px solid #547065;background:linear-gradient(to bottom,#3b554a 1px,transparent 1px) top/100% 25%}
.bars{position:absolute;inset:0;display:grid;gap:3px;align-items:end;padding:0 3px}
.bar-slot{height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0;outline:0}
.bar{width:100%;max-width:32px;border-radius:5px 5px 0 0;background:linear-gradient(#a4d6b0,#6baa88);transition:height .2s}
.bar-slot:hover .bar,.bar-slot:focus-visible .bar{background:linear-gradient(#d4f0cf,#9bd3a9)}
.bar-slot:focus-visible{outline:2px solid #c9eac9;outline-offset:2px}
.x-axis{display:grid;gap:3px;margin:10px 0 0 54px;padding:0 3px;color:#97ad9e;font-size:11px;font-variant-numeric:tabular-nums;text-align:center}
.x-axis span{min-width:0;white-space:nowrap}
.empty{padding:14px 0 0 54px;color:#a9bbaf;font-size:14px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#192925;border:1px solid #365047;border-radius:18px;padding:22px}
.stat span{font-size:13px;color:#a5bbab}
.stat b{display:block;font-size:25px;font-weight:620;margin-top:8px;font-variant-numeric:tabular-nums}
footer{margin-top:28px;color:#809b88;font-size:13px;line-height:1.5}
@media(max-width:600px){main{padding:23px 15px 55px}.card{border-radius:20px}.tabs button{font-size:13px}.chart-layout{grid-template-columns:35px minmax(0,1fr);gap:5px}.x-axis{margin-left:40px;font-size:10px}.bars,.x-axis{gap:2px}.empty{padding-left:40px}.summary{grid-template-columns:repeat(2,1fr)}.stat{padding:17px}.stat b{font-size:21px}}
</style>
</head>
<body>
<main>
<header><h1>练习记录</h1><div class="brand">琴时 / PIANO MONITOR</div></header>
<section class="card overview">
  <nav class="tabs" aria-label="统计时段">
    <button type="button" data-range="today" class="active">今天</button>
    <button type="button" data-range="week">本周</button>
    <button type="button" data-range="month">本月</button>
    <button type="button" data-range="custom">自定义</button>
  </nav>
  <div class="custom" id="custom"><input type="date" id="from" aria-label="开始日期"><span>至</span><input type="date" id="to" aria-label="结束日期"></div>
  <div class="label">练习总时长</div>
  <div class="total"><strong id="total">0</strong><span id="unit">分钟</span></div>
  <div class="overview-foot"><span id="period">—</span><span id="updated">—</span></div>
</section>
<section class="card">
  <div class="chart-head"><h2 id="chartTitle">每小时练习</h2><span id="chartNote">北京时间</span></div>
  <div class="chart-layout">
    <div class="y-axis" id="yAxis" aria-hidden="true"></div>
    <div class="plot"><div class="bars" id="bars"></div></div>
  </div>
  <div class="x-axis" id="xAxis" aria-hidden="true"></div>
  <div class="empty" id="empty" hidden>这段时间还没有练习记录。</div>
</section>
<section class="summary">
  <div class="stat"><span>练习天数</span><b id="days">0</b></div>
  <div class="stat"><span>练习次数</span><b id="sessions">0</b></div>
  <div class="stat"><span>日均时长</span><b id="average">0 分钟</b></div>
</section>
<footer>时间按北京时间计算。每次练习结束并同步后，刷新页面即可看到新记录。</footer>
</main>
<script>
const H=8*3600000, DAY=86400000, HOUR=3600000;
let sessions=[], range='today';
const $=id=>document.getElementById(id);
function localDay(ms){return new Date(ms+H).toISOString().slice(0,10)}
function dayStart(day){return Date.parse(day+'T00:00:00Z')-H}
function addDay(day,n){return new Date(Date.parse(day+'T00:00:00Z')+n*DAY).toISOString().slice(0,10)}
function duration(seconds){if(seconds>0&&seconds<30)return '少于 1 分钟';let m=Math.round(seconds/60);return m>=60?Math.floor(m/60)+' 小时 '+m%60+' 分钟':m+' 分钟'}
function bounds(){
  let today=localDay(Date.now());
  if(range==='today')return [today,today];
  if(range==='week'){let weekday=(new Date(dayStart(today)+H).getUTCDay()+6)%7;return [addDay(today,-weekday),addDay(today,6-weekday)]}
  if(range==='month'){let first=today.slice(0,7)+'-01';let days=new Date(Date.UTC(Number(today.slice(0,4)),Number(today.slice(5,7)),0)).getUTCDate();return [first,addDay(first,days-1)]}
  return [$('from').value||today,$('to').value||today];
}
function axisMax(max){
  if(max<=0)return 15*60;
  for(let minutes of [5,10,15,30,45,60,90,120,180,240,360,480,720,1440]){
    if(max<=minutes*60)return minutes*60;
  }
  return Math.ceil(max/3600)*3600;
}
function axisText(seconds){
  let minutes=Math.round(seconds/60);
  return minutes>=60?Math.round(minutes/60*10)/10+'小时':minutes+'分';
}
function render(){
  let [from,to]=bounds();if(from>to)[from,to]=[to,from];
  let first=dayStart(from),last=dayStart(addDay(to,1));
  let daily=new Map(),hourly=Array(24).fill(0),count=0;
  for(let s of sessions){
    let a=Date.parse(s.start),b=Date.parse(s.end);
    if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a||b<=first||a>=last)continue;
    count++;a=Math.max(a,first);b=Math.min(b,last);
    while(a<b){
      let day=localDay(a),hour=new Date(a+H).getUTCHours();
      let nextHour=(Math.floor((a+H)/HOUR)+1)*HOUR-H;
      let end=Math.min(b,nextHour),seconds=(end-a)/1000;
      daily.set(day,(daily.get(day)||0)+seconds);
      if(range==='today')hourly[hour]+=seconds;
      a=end;
    }
  }
  let total=[...daily.values()].reduce((a,b)=>a+b,0),minutes=Math.round(total/60);
  $('total').textContent=minutes>=60?Math.floor(minutes/60):minutes;
  $('unit').textContent=minutes>=60?'小时 '+minutes%60+' 分钟':'分钟';
  $('days').textContent=[...daily.values()].filter(v=>v>0).length;
  $('sessions').textContent=count;
  let span=Math.max(1,Math.round((last-first)/DAY));
  $('average').textContent=duration(total/span);
  $('period').textContent=from===to?from:from+' — '+to;
  let bins=[];
  if(range==='today'){
    $('chartTitle').textContent='每小时练习';
    bins=hourly.map((value,hour)=>({key:String(hour).padStart(2,'0')+':00',value,label:hour%3===0?String(hour).padStart(2,'0'):''}));
  }else{
    $('chartTitle').textContent='每日练习';
    for(let day=from;day<=to;day=addDay(day,1))bins.push({key:day,value:daily.get(day)||0,label:''});
    if(bins.length>45){
      $('chartTitle').textContent='每月练习';
      let monthly=new Map();
      for(let bin of bins){let key=bin.key.slice(0,7);monthly.set(key,(monthly.get(key)||0)+bin.value)}
      bins=[...monthly].map(([key,value])=>({key,value,label:key.slice(5)}));
    }else if(range==='week'){
      let weekdays=['日','一','二','三','四','五','六'];
      bins.forEach(bin=>bin.label='周'+weekdays[new Date(dayStart(bin.key)+H).getUTCDay()]);
    }else{
      bins.forEach((bin,i)=>{let day=Number(bin.key.slice(-2));bin.label=(i===0||i===bins.length-1||day%5===0)?String(day):''});
    }
  }
  $('chartNote').textContent=range==='today'?'24 小时 · 北京时间':bins.length+' '+($('chartTitle').textContent==='每月练习'?'个月':'天')+' · 北京时间';
  let maximum=axisMax(Math.max(0,...bins.map(bin=>bin.value)));
  let axis=$('yAxis');axis.replaceChildren();
  for(let i=4;i>=0;i--){let tick=document.createElement('span');tick.textContent=axisText(maximum*i/4);axis.append(tick)}
  let bars=$('bars'),labels=$('xAxis');
  bars.replaceChildren();labels.replaceChildren();
  bars.style.gridTemplateColumns='repeat('+bins.length+',minmax(0,1fr))';
  labels.style.gridTemplateColumns='repeat('+bins.length+',minmax(0,1fr))';
  for(let bin of bins){
    let slot=document.createElement('div');slot.className='bar-slot';
    slot.setAttribute('role','img');slot.setAttribute('aria-label',bin.key+'，'+duration(bin.value));
    if(bin.value)slot.tabIndex=0;
    slot.title=bin.key+' · '+duration(bin.value);
    let bar=document.createElement('div');bar.className='bar';
    bar.style.height=(bin.value/maximum*100)+'%';
    slot.append(bar);bars.append(slot);
    let label=document.createElement('span');label.textContent=bin.label;labels.append(label);
  }
  $('empty').hidden=total>0;
}
document.querySelectorAll('[data-range]').forEach(button=>button.onclick=()=>{
  range=button.dataset.range;
  document.querySelectorAll('[data-range]').forEach(item=>item.classList.toggle('active',item===button));
  $('custom').classList.toggle('show',range==='custom');render();
});
$('from').onchange=$('to').onchange=render;
let today=localDay(Date.now());$('from').value=addDay(today,-6);$('to').value=today;
fetch('./data.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error();return response.json()})
.then(data=>{sessions=data.sessions||[];$('updated').textContent='已记录 '+sessions.length+' 次';render()})
.catch(()=>{$('updated').textContent='记录加载失败';render()});
</script>
</body>
</html>
