<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>琴时 · 练习记录</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#f2f1e9;background:#101a19}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:32px 22px 70px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:48px}.eyebrow{color:#92ac9c;font-size:12px;font-weight:700;letter-spacing:.2em}.brand{font-size:16px;letter-spacing:.2em;font-weight:700}.muted{color:#a6b7ad}h1{font-size:clamp(42px,8vw,76px);letter-spacing:-.065em;line-height:1.05;margin:12px 0 16px;font-weight:600}h2{font-size:20px;font-weight:600;margin:0 0 22px}.hero{background:radial-gradient(circle at 85% 10%,#31594d 0,transparent 42%),linear-gradient(135deg,#203b35,#172d2a);border:1px solid #47645a;border-radius:28px;padding:clamp(26px,5vw,48px);min-height:310px;margin-bottom:26px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}.tabs button{border:1px solid #577167;background:#264139;color:#dae8dd;border-radius:50px;padding:9px 17px;font:inherit;cursor:pointer}.tabs button.active{background:#d7ead9;color:#20382a}.big{font-size:clamp(66px,12vw,118px);letter-spacing:-.08em;line-height:1;font-weight:600}.big small{font-size:22px;letter-spacing:0;margin-left:8px}.hero-bottom{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-top:28px}.period{font-size:15px;color:#c7dbcb}.panel{background:#182624;border:1px solid #334b43;border-radius:24px;padding:26px;margin-bottom:20px}.bar-row{display:grid;grid-template-columns:80px 1fr 75px;gap:12px;align-items:center;margin:14px 0;font-size:13px;color:#b9cabc}.track{background:#2a3b35;height:10px;border-radius:10px;overflow:hidden}.fill{background:linear-gradient(90deg,#8cc99b,#cce5ba);height:100%;border-radius:10px;min-width:0}.bar-row strong{text-align:right;color:#eef7eb;font-variant-numeric:tabular-nums}.custom{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin:-8px 0 24px}.custom.show{display:flex}input[type=date]{background:#233b34;border:1px solid #5e7b6b;color:#eef5ed;border-radius:9px;padding:9px;font:inherit}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#182624;border:1px solid #334b43;border-radius:20px;padding:22px}.stat b{display:block;font-size:27px;margin:10px 0 0}.stat span{font-size:13px;color:#a6baac}footer{margin-top:35px;color:#809a88;font-size:13px}.empty{color:#a6b7ad;padding:18px 0}@media(max-width:600px){header{margin-bottom:28px}.summary{grid-template-columns:1fr 1fr}.bar-row{grid-template-columns:65px 1fr 65px;gap:7px}.panel{padding:20px}.hero{min-height:290px}}
</style>
<main><header><div class="brand">琴时 <span class="muted">/ PIANO MONITOR</span></div><div class="eyebrow">PRACTICE JOURNAL</div></header>
<section class="hero"><div class="eyebrow">你的练习时光</div><h1>每一次落键，<br>都算数。</h1><div class="tabs"><button data-range="today" class="active">今天</button><button data-range="week">本周</button><button data-range="month">本月</button><button data-range="custom">自定义</button></div><div class="custom" id="custom"><input type="date" id="from" aria-label="开始日期"><span>至</span><input type="date" id="to" aria-label="结束日期"></div><div class="big"><span id="total">0</span><small id="unit">分钟</small></div><div class="hero-bottom"><div class="period" id="period">—</div><div class="muted" id="updated">—</div></div></section>
<div class="summary"><div class="stat"><span>练习天数</span><b id="days">0</b></div><div class="stat"><span>练习次数</span><b id="sessions">0</b></div><div class="stat"><span>日均时长</span><b id="average">0 分钟</b></div></div>
<section class="panel" style="margin-top:20px"><h2>每日练习</h2><div id="chart"></div></section><footer>时间按北京时间计算。每次练习结束并同步后，刷新页面即可看到新记录。</footer></main>
<script>
const H=8*3600000,DAY=86400000;let sessions=[],range='today';const $=id=>document.getElementById(id);
function localDay(ms){return new Date(ms+H).toISOString().slice(0,10)}
function dayStart(day){return Date.parse(day+'T00:00:00Z')-H}
function addDay(day,n){return new Date(Date.parse(day+'T00:00:00Z')+n*DAY).toISOString().slice(0,10)}
function display(seconds){let m=Math.round(seconds/60);return m>=60?`${Math.floor(m/60)} 小时 ${m%60} 分钟`:`${m} 分钟`}
function bounds(){let today=localDay(Date.now());if(range==='today')return[today,today];if(range==='week'){let weekday=(new Date(dayStart(today)+H).getUTCDay()+6)%7;return[addDay(today,-weekday),addDay(today,6-weekday)]}if(range==='month')return[today.slice(0,7)+'-01',addDay(new Date(Date.parse(today.slice(0,7)+'-01T00:00:00Z')).toISOString().slice(0,10),new Date(Date.UTC(Number(today.slice(0,4)),Number(today.slice(5,7)),0)).getUTCDate()-1)];return[$('from').value||today,$('to').value||today]}
function render(){let [from,to]=bounds();if(from>to)[from,to]=[to,from];let first=dayStart(from),last=dayStart(addDay(to,1));let daily=new Map();let count=0;for(let s of sessions){let a=Date.parse(s.start),b=Date.parse(s.end);if(!Number.isFinite(a)||!Number.isFinite(b)||b<=first||a>=last)continue;count++;a=Math.max(a,first);b=Math.min(b,last);while(a<b){let day=localDay(a),end=Math.min(b,dayStart(addDay(day,1)));daily.set(day,(daily.get(day)||0)+(end-a)/1000);a=end}}let total=[...daily.values()].reduce((a,b)=>a+b,0);let mins=Math.round(total/60);$('total').textContent=mins>=60?Math.floor(mins/60):mins;$('unit').textContent=mins>=60?`小时 ${mins%60} 分钟`:'分钟';$('days').textContent=[...daily.values()].filter(v=>v>0).length;$('sessions').textContent=count;let span=Math.max(1,Math.round((last-first)/DAY));$('average').textContent=display(total/span);$('period').textContent=from===to?from:`${from} — ${to}`;let max=Math.max(1,...daily.values());let rows=[];for(let day=from;day<=to;day=addDay(day,1))rows.push([day,daily.get(day)||0]);if(rows.length>45){let monthly=new Map();for(let [day,v] of rows){let key=day.slice(0,7);monthly.set(key,(monthly.get(key)||0)+v)}rows=[...monthly]}let chart=$('chart');chart.replaceChildren();if(!total){let empty=document.createElement('p');empty.className='empty';empty.textContent='这段时间还没有练习记录。';chart.append(empty)}else for(let [day,seconds] of rows){let row=document.createElement('div');row.className='bar-row';let label=document.createElement('span');label.textContent=day.length===7?day:day.slice(5);let track=document.createElement('div');track.className='track';let fill=document.createElement('div');fill.className='fill';fill.style.width=(seconds/max*100)+'%';track.append(fill);let value=document.createElement('strong');value.textContent=seconds?`${Math.round(seconds/60)} 分`:'—';row.append(label,track,value);chart.append(row)}}
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));$('custom').classList.toggle('show',range==='custom');render()});$('from').onchange=$('to').onchange=render;let today=localDay(Date.now());$('from').value=addDay(today,-6);$('to').value=today;fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{sessions=data.sessions||[];$('updated').textContent=`已记录 ${sessions.length} 次`;render()}).catch(()=>{$('updated').textContent='记录加载失败';render()});
</script></html>
