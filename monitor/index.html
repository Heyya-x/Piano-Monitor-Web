<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>钢琴监听 · 本地控制</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#252821;background:#f4f3ee}*{box-sizing:border-box}body{margin:0}.shell{max-width:820px;margin:auto;padding:24px 18px 56px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#737a68;font-weight:700}h1{font-size:clamp(30px,5vw,44px);line-height:1.1;margin:8px 0}p{color:#6c7268}.badge{padding:10px 14px;border-radius:99px;background:#e5eadf;color:#36543a;font-size:13px;white-space:nowrap}.card{background:#fff;border:1px solid #e5e7dd;border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 8px 28px #26381a08}h2{font-size:19px;margin:0 0 20px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px}.big{font-size:40px;font-weight:700;letter-spacing:-.04em}.label{font-size:13px;color:#6f766b}.meter{height:10px;border-radius:10px;background:#e7eae3;overflow:hidden;margin-top:16px}.meter span{display:block;height:100%;width:0;background:#55845a;transition:width .15s}label{display:block;font-weight:600;font-size:14px;margin:20px 0 8px}select,input[type=number]{width:100%;height:43px;padding:0 12px;border:1px solid #cdd4c8;border-radius:10px;background:white;color:#252821;font:inherit}input[type=range]{width:100%;accent-color:#56855b}.control{display:flex;justify-content:space-between;gap:12px}.control strong{font-variant-numeric:tabular-nums}.hint{font-size:13px;line-height:1.5;margin:8px 0 0}footer{font-size:13px;color:#7b8176;line-height:1.6}a{color:#315f37}.save{font-size:13px;color:#387540;min-height:20px}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.hero{grid-template-columns:1fr}}
</style>
<div class="shell"><header><div><div class="eyebrow">PIANO MONITOR / LOCAL</div><h1>钢琴监听</h1><p>声音直通与练习记录</p></div><div class="badge" id="status">连接中</div></header>
<section class="card"><div class="hero"><div><div class="label">当前输入电平</div><div class="big"><span id="level">—</span><small style="font-size:16px"> dBFS</small></div><div class="meter"><span id="meter"></span></div></div><div><div class="label">当前练习</div><div class="big" id="duration">未开始</div><p id="sessionNote" class="hint">输入音量超过阈值时自动开始。</p></div></div></section>
<section class="card"><h2>音频设备</h2><label for="input">输入设备</label><select id="input"></select><label for="output">输出设备</label><select id="output"></select><p class="hint">自动选择会在 USB Audio Device 重新连接后再次找到它。切换设备会短暂重启音频通路。</p></section>
<section class="card"><h2>监听设置</h2><div class="control"><label for="volume">输出音量</label><strong id="volumeValue"></strong></div><input id="volume" type="range" min="0" max="150" step="1"><p class="hint">超过 100% 可能产生削波；建议先调节钢琴与音箱的硬件音量。</p><div class="control"><label for="threshold_db">活跃阈值</label><strong id="thresholdValue"></strong></div><input id="threshold_db" type="range" min="-80" max="-10" step="1"><p class="hint">绿色电平条在静音噪声时应低于阈值；弹琴时应高于阈值。</p><label for="idle_seconds">停止练习前的静音时间（秒）</label><input id="idle_seconds" type="number" min="5" max="3600" step="1"><p class="hint">记录到最后一次活跃声音；静音超时后自动保存并同步到 GitHub。</p><p class="save" id="save"></p></section>
<footer>此页面仅在树莓派所在局域网提供。练习记录会写入仓库；<a href="https://heyya-x.github.io/Piano-Monitor-Web/" target="_blank" rel="noopener">查看统计页面</a>。</footer></div>
<script>
const ids=['input','output','volume','threshold_db','idle_seconds'];let initialized=false,last={};
const el=id=>document.getElementById(id);
function choices(id,devices,value){let list=devices.filter(d=>d[id==='input'?'input':'output']);let options=[['auto','自动选择 USB Audio Device'],...list.map(d=>[d.id,`${d.name} · ${d.id}`])];if(value!=='auto'&&!options.some(x=>x[0]===value))options.push([value,`${value}（未连接）`]);el(id).replaceChildren(...options.map(([v,n])=>{let o=document.createElement('option');o.value=v;o.textContent=n;return o}));el(id).value=value}
function values(){el('volumeValue').textContent=el('volume').value+'%';el('thresholdValue').textContent=el('threshold_db').value+' dBFS'}
async function refresh(){try{let r=await fetch('/api/status',{cache:'no-store'}),s=await r.json();last=s;el('status').textContent=s.audio_status;el('level').textContent=s.level_db.toFixed(1);el('meter').style.width=Math.max(0,Math.min(100,(s.level_db+80)/70*100))+'%';if(s.session){let n=Math.max(0,Math.floor(Date.now()/1000-s.session.start));el('duration').textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;el('sessionNote').textContent='练习正在记录中'}else{el('duration').textContent='未开始';el('sessionNote').textContent='输入音量超过阈值时自动开始。'}if(!initialized){for(let id of ['input','output'])choices(id,s.devices,s.config[id]);for(let id of ['volume','threshold_db','idle_seconds'])el(id).value=s.config[id];values();initialized=true}else{for(let id of ['input','output'])if(document.activeElement!==el(id))choices(id,s.devices,el(id).value)}}catch(e){el('status').textContent='连接失败'}}
let timer;async function save(){let body={};for(let id of ids)body[id]=['volume','threshold_db','idle_seconds'].includes(id)?Number(el(id).value):el(id).value;try{let r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),s=await r.json();if(!r.ok)throw Error(s.error);el('save').textContent='设置已保存';setTimeout(()=>el('save').textContent='',2500)}catch(e){el('save').textContent='保存失败：'+e.message}}
ids.forEach(id=>el(id).addEventListener(id==='volume'||id==='threshold_db'?'input':'change',()=>{values();clearTimeout(timer);timer=setTimeout(save,300)}));refresh();setInterval(refresh,1000);
</script></html>
